[build]
  command = "PUPPETEER_SKIP_DOWNLOAD=true npm run build"
  publish = "dist"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"

# llms.txt and its full-content companion. Explicit UTF-8 so the em dashes and
# quotes in the prose are not mangled for the assistants that read them.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Third-party origins serve only engine code and models (OCR worker/core and
    # language data, ONNX runtime, background-removal model); user files never
    # leave the browser. Background removal needs 'unsafe-eval' (its ndarray
    # dependency compiles code at runtime; this also covers WebAssembly) and blob:
    # (its runtime loads code and wasm from blob URLs).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' blob: https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://staticimgly.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.onnx"
  [headers.values]
    Content-Type = "application/octet-stream"
